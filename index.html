<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  color: #fff;
}

.wrapper {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.promo-box {
  width: 100%;
  margin-bottom: 20px;
  padding: 16px;
  text-align: center;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  border-radius: 12px;
  font-size: 14px;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.2);
  box-shadow: 0 10px 20px -5px rgba(245, 158, 11, 0.4);
  animation: pulse-glow 1.5s infinite alternate;
  letter-spacing: 0.5px;
}

@keyframes pulse-glow {
  0% { transform: scale(1); box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
  100% { transform: scale(1.02); box-shadow: 0 0 25px rgba(245, 158, 11, 0.7); }
}

.captcha-box {
  width: 100%;
  padding: 22px 20px;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  overflow: hidden;
}

.captcha-left {
  display: flex;
  align-items: center;
  cursor: pointer;
}

.checkbox-container {
  position: relative;
  width: 32px;
  height: 32px;
  margin-right: 14px;
}

.checkbox-custom {
  position: absolute;
  top: 0;
  left: 0;
  width: 32px;
  height: 32px;
  background-color: rgba(255, 255, 255, 0.08);
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 8px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.captcha-left:hover .checkbox-custom {
  border-color: #38bdf8;
  background-color: rgba(56, 189, 248, 0.1);
}

.captcha-left input {
  position: absolute;
  opacity: 0;
  cursor: pointer;
  height: 0;
  width: 0;
}

.captcha-left input:checked ~ .checkbox-custom {
  background-color: #10b981;
  border-color: #10b981;
  transform: scale(0.95);
}

.loader {
  display: none;
  width: 24px;
  height: 24px;
  border: 3px solid rgba(255,255,255,0.2);
  border-top: 3px solid #38bdf8;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  position: absolute;
  top: 4px;
  left: 4px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.checkmark {
  display: none;
  width: 32px;
  height: 32px;
  position: absolute;
  top: 0;
  left: 0;
}
.checkmark:after {
  content: "";
  position: absolute;
  left: 11px;
  top: 6px;
  width: 8px;
  height: 14px;
  border: solid #fff;
  border-width: 0 3px 3px 0;
  transform: rotate(45deg);
}

.captcha-text {
  font-size: 15px;
  color: #f1f5f9;
  font-weight: 500;
  user-select: none;
}

.captcha-right {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.captcha-right img {
  width: 28px;
  height: 28px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.captcha-right span {
  font-size: 9px;
  color: #94a3b8;
  margin-top: 4px;
  text-align: center;
}

.light-bar-container {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: transparent;
  overflow: hidden;
  border-bottom-left-radius: 16px;
  border-bottom-right-radius: 16px;
}

.light-bar {
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    #38bdf8 50%,
    transparent 100%
  );
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="container">

    <div class="promo-box">
      
    </div>

    <div class="captcha-box" id="captchaBox">
      <label class="captcha-left" id="captchaLabel">
        <div class="checkbox-container">
          <input type="checkbox" id="captchaCheck" onchange="verifyCaptcha(this)">
          <div class="checkbox-custom" id="boxCustom"></div>
          <div class="loader" id="captchaLoader"></div>
          <div class="checkmark" id="captchaCheckmark"></div>
        </div>
        <span class="captcha-text">Tôi không phải là người máy</span>
      </label>

      <div class="captcha-right">
        <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" alt="recaptcha">
        <span>Bảo mật</span>
      </div>

      <div class="light-bar-container">
        <div class="light-bar" id="lightBar"></div>
      </div>
    </div>

  </div>
</div>

<script>
function verifyCaptcha(checkbox) {
  if (checkbox.checked) {
    checkbox.disabled = true;
    document.getElementById("captchaLabel").style.cursor = "default";

    const loader = document.getElementById("captchaLoader");
    const checkmark = document.getElementById("captchaCheckmark");
    const customBox = document.getElementById("boxCustom");

    customBox.style.display = "none";
    loader.style.display = "block";

    setTimeout(() => {
      loader.style.display = "none";
      checkmark.style.display = "block";
      startEffect();
    }, 600);
  }
}

function startEffect() {
  const bar = document.getElementById("lightBar");
  bar.style.transition = "left 0.5s ease-in-out";
  bar.style.left = "100%";

  if (typeof fbq === 'function') {
    fbq('track', 'CompleteRegistration');
  }

  setTimeout(() => {
    window.location.href = "https://dk.dabetphay.online/?a=ce6286ec140ed6f5625f5c125693b0f0&utm_campaign=facebookads&utm_source=gerto&utm_medium=conversion&referrer_domain=dk.dabetphay.online";
  }, 800);
}
</script>

</body>
</html>
